services:
  - type: web
    name: vam09-kuh
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vam09-kuh-pilot-db
          property: connectionString
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SESSION_KEY
        generateValue: true
databases:
  - name: vam09-kuh-pilot-db
    plan: free
    region: frankfurt
    ipAllowList: []
